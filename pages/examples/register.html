<!DOCTYPE html>
<html class="lockscreen">
    <head>
        <meta charset="UTF-8">
        <title>Registration Vendor Dharma Polimetal</title>
        <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'>
        <!-- bootstrap 3.0.2 -->
        <link href="../../css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <!-- font Awesome -->
        <link href="../../css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <!-- Theme style -->
        <link href="../../css/AdminLTE.css" rel="stylesheet" type="text/css" />

        <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
        <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
        <!--[if lt IE 9]>
          <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
          <script src="https://oss.maxcdn.com/libs/respond.js/1.3.0/respond.min.js"></script>
        <![endif]-->
    </head>
    <body>

        <div class="form-box" id="login-box">
            <div class="header bg-blue">Register</div>
            <form action="../../index.html" method="post">
                <div class="body bg-white">
					
					<div class="form-group">
                        <label>Vendor name</label>
                        <div class="input-group">
                            <div class="input-group-addon">
                                <i class="fa fa-truck"></i>
                            </div>
                            <input type="text" class="form-control" placeholder="Your Company, PT." required/>
                        </div><!-- /.input group -->
                    </div><!-- /.form group -->
					
					<div class="form-group">
                        <label>Sales Person</label>
                        <div class="input-group">
                            <div class="input-group-addon">
                                <i class="fa fa-users"></i>
                            </div>
                            <input type="text" class="form-control" placeholder="Sale person name (Mr/Ms)" required/>
                        </div><!-- /.input group -->
                    </div><!-- /.form group -->
					
					<div class="form-group">
                        <label>Contact Number</label>
                        <div class="input-group">
                            <div class="input-group-addon">
                                <i class="fa fa-phone"></i>
                            </div>
                            <input type="text" class="form-control" placeholder="+6221 0987 665" required/>
                        </div><!-- /.input group -->
                    </div><!-- /.form group -->
					
					<div class="form-group">
                        <label>Email</label>
                        <div class="input-group">
                            <div class="input-group-addon">
                                <i class="fa fa-envelope"></i>
                            </div>
                            <input type="email" class="form-control" placeholder="your_mail@domain.com" required/>
                        </div><!-- /.input group -->
                    </div><!-- /.form group -->
					
                </div>
                <div class="footer">                    

                    <button type="submit" class="btn bg-blue btn-block">Register</button>

                    <a href="login.html" class="text-center">I already have a membership</a>
                </div>
            </form>

        </div>


        <!-- jQuery 2.0.2 -->
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.min.js"></script>
		
        <!-- Bootstrap -->
        <script src="../../js/bootstrap.min.js" type="text/javascript"></script>

    </body>
</html>
